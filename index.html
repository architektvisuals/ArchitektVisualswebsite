/* Идея: ночной Minecraft. Тёмный сланец, трава как единственный яркий акцент, золото для статуса. */
:root {
  color-scheme: dark;
  --bg: #12161c; --panel: #1b222b; --panel2: #252e3a; --edge: #080a0d;
  --fg: #e9edf2; --muted: #9aa6b4;
  --grass: #6dc24b; --grass-d: #3e7b29; --gold: #f0c548; --danger: #f2796a; --on-grass: #0c1a07;
  --f-display: "Press Start 2P", "Courier New", monospace;
  --f-body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #e8eee3; --panel: #ffffff; --panel2: #eff4ea; --edge: #27301f;
    --fg: #1b2216; --muted: #56624b;
    --grass: #4aa22b; --grass-d: #2f7a1a; --gold: #9a6a05; --danger: #c43d2c; --on-grass: #ffffff;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e8eee3; --panel: #ffffff; --panel2: #eff4ea; --edge: #27301f;
  --fg: #1b2216; --muted: #56624b;
  --grass: #4aa22b; --grass-d: #2f7a1a; --gold: #9a6a05; --danger: #c43d2c; --on-grass: #ffffff;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--f-body); margin: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 4px solid var(--edge); }
.logo { font: 12px/1.4 var(--f-display); letter-spacing: .04em; }
.logo b { color: var(--grass); font-weight: 400; }
.who { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--gold); min-width: 0; }
.who span { overflow-wrap: anywhere; }

.hero { padding: 40px 0 24px; max-width: 640px; }
.hero h1 { font: 22px/1.5 var(--f-display); margin: 0 0 16px; text-wrap: balance; }
.hero p { color: var(--muted); margin: 0 0 20px; max-width: 52ch; }

.btn { font: 700 15px/1 var(--f-body); color: var(--fg); background: var(--panel2); cursor: pointer; text-decoration: none; display: inline-block; text-align: center;
  padding: 12px 18px; border: 4px solid var(--edge); border-radius: 0;
  box-shadow: inset -4px -4px 0 rgba(0,0,0,.28), inset 4px 4px 0 rgba(255,255,255,.14); }
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: translateY(2px); }
.btn:focus-visible, .chip:focus-visible, input:focus-visible, .x:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn.green { background: var(--grass); color: var(--on-grass); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--muted); color: var(--muted); padding: 8px 12px; font-size: 13px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .6; cursor: wait; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 20px; }
.chip { font: 13px/1 var(--f-body); font-weight: 500; color: var(--muted); background: var(--panel); border: 3px solid var(--edge); padding: 9px 14px; cursor: pointer; border-radius: 0; }
.chip[aria-pressed="true"] { background: var(--grass-d); color: #fff; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 20px; }
.card { background: var(--panel); border: 4px solid var(--edge); display: flex; flex-direction: column; min-width: 0; box-shadow: 6px 6px 0 rgba(0,0,0,.3); }
.pic { aspect-ratio: 960 / 524; max-width: 100%; position: relative; border-bottom: 4px solid var(--edge); overflow: hidden; }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pic.shader { background: linear-gradient(#1b2a5c 0 28%, #e2724b 28% 52%, #f0c548 52% 62%, #3b6b2b 62% 100%); }
.pic.mod { background: conic-gradient(from 90deg at 50% 50%, #6b4a2b 25%, #7e5b38 0 50%, #6b4a2b 0 75%, #7e5b38 0) 0 0 / 36px 36px; }
.pic.map { background: conic-gradient(from 90deg at 50% 50%, #4f9a2e 25%, #62b43c 0 50%, #4f9a2e 0 75%, #62b43c 0) 0 0 / 28px 28px; }
.tag { position: absolute; left: 10px; top: 10px; background: var(--edge); color: #f0c548; font: 9px/1 var(--f-display); padding: 6px 8px; text-transform: uppercase; }
.body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.body h3 { margin: 0; font-size: 18px; line-height: 1.3; overflow-wrap: anywhere; }
.meta { font-size: 13px; color: var(--muted); display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
.desc { margin: 0; flex: 1; font-size: 15px; color: var(--fg); overflow-wrap: anywhere; }
.desc.locked { color: var(--muted); font-style: italic; }
.ok { font-size: 13px; color: var(--gold); margin: 0; }
.empty { color: var(--muted); padding: 32px 0; text-align: center; }

footer { margin-top: 36px; padding-top: 16px; border-top: 4px solid var(--edge); color: var(--muted); font-size: 13px; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.overlay[hidden] { display: none; }
.dialog { position: relative; width: 100%; max-width: 400px; background: var(--panel); border: 4px solid var(--edge); padding: 22px; box-shadow: 8px 8px 0 rgba(0,0,0,.5); }
.dialog h2 { font: 14px/1.5 var(--f-display); margin: 0 28px 10px 0; }
.dialog p.hint { margin: 0 0 16px; font-size: 14px; color: var(--muted); }
.x { position: absolute; right: 8px; top: 8px; background: none; border: 0; color: var(--muted); font: 20px/1 var(--f-body); cursor: pointer; padding: 6px 10px; }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
input { display: block; width: 100%; margin-top: 5px; padding: 12px; font: 16px var(--f-body); color: var(--fg); background: var(--bg); border: 3px solid var(--edge); border-radius: 0; }
.err { min-height: 1.4em; color: var(--danger); font-size: 14px; margin: 0 0 8px; }

@media (prefers-reduced-motion: no-preference) { .card { transition: transform .12s; } .card:hover { transform: translate(-2px, -2px); } }
@media (max-width: 520px) { .hero { padding-top: 28px; } .hero h1 { font-size: 17px; } }

<div class="wrap">
  <header>
    <div class="logo">ARCHITEKT<b>VISUALS</b></div>
    <div class="who" id="who"></div>
  </header>

  <section class="hero">
    <h1>Шейдеры, моды и карты для Minecraft</h1>
    <p id="heroText"></p>
    <button class="btn green" id="heroBtn" type="button">Зарегистрироваться</button>
  </section>

  <main>
    <div class="chips" id="chips" role="group" aria-label="Фильтр по типу">
      <button class="chip" type="button" data-t="all" aria-pressed="true">Все</button>
      <button class="chip" type="button" data-t="shader" aria-pressed="false">Шейдеры</button>
      <button class="chip" type="button" data-t="mod" aria-pressed="false">Моды</button>
      <button class="chip" type="button" data-t="map" aria-pressed="false">Карты</button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>Здесь пока пусто.</p>
  </main>

  <footer>Ключ выдаёт автор. Один ключ открывает скачивание одного мода. Аккаунт хранится в этом браузере.</footer>
</div>

<div class="overlay" id="regOv" hidden>
  <form class="dialog" id="regForm" autocomplete="on" role="dialog" aria-modal="true" aria-labelledby="regT">
    <button class="x" type="button" data-close aria-label="Закрыть">&times;</button>
    <h2 id="regT">АККАУНТ</h2>
    <div class="chips" id="modeTabs" role="group" aria-label="Регистрация или вход">
      <button class="chip" type="button" data-m="register" aria-pressed="true">Регистрация</button>
      <button class="chip" type="button" data-m="login" aria-pressed="false">Вход</button>
    </div>
    <label for="nick">Ник
      <input id="nick" name="nick" required minlength="3" maxlength="20" autocomplete="username">
    </label>
    <label for="pass">Пароль
      <input id="pass" name="pass" type="password" required minlength="8" maxlength="100" autocomplete="new-password">
    </label>
    <p class="err" id="regErr" role="alert"></p>
    <button class="btn green wide" type="submit" id="regBtn">Создать аккаунт</button>
  </form>
</div>

<div class="overlay" id="keyOv" hidden>
  <form class="dialog" id="keyForm" autocomplete="off" role="dialog" aria-modal="true" aria-labelledby="keyT">
    <button class="x" type="button" data-close aria-label="Закрыть">&times;</button>
    <h2 id="keyT">КЛЮЧ ДОСТУПА</h2>
    <p class="hint" id="keyFor"></p>
    <label for="keyIn">Ключ
      <input id="keyIn" name="key" required placeholder="MC-XXXXX-XXXXX-XXXXX-XXXXX" autocapitalize="characters" spellcheck="false">
    </label>
    <p class="err" id="keyErr" role="alert"></p>
    <button class="btn green wide" type="submit" id="keyBtn">Открыть скачивание</button>
  </form>
</div>

    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

  // ---- криптография: ссылка зашифрована ключом, без ключа её не достать ----
  const enc = new TextEncoder();
  async function sha(s) { return new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(s))); }
  const hex = u8 => Array.from(u8, b => b.toString(16).padStart(2, '0')).join('');
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function pbkdf(pw, saltB64) {
    const k = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(saltB64), iterations: 150000 }, k, 256);
    return hex(new Uint8Array(bits));
  }
  async function decryptLink(item, raw) {
    let n = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (n.length === 20) n = 'MC' + n;
    const h = n.length === 22 ? hex(await sha('id:' + n)) : '';
    const rec = DATA.keys.find(k => k.h === h);
    if (!rec) throw new Error('Ключ не подходит');
    if (rec.item !== item.id) throw new Error('Это ключ от другого мода');
    const key = await crypto.subtle.importKey('raw', await sha('enc:' + n), 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(rec.iv) }, key, unb64(rec.ct));
    return { url: JSON.parse(new TextDecoder().decode(plain)).url, n };
  }

  // ---- отрисовка ----
  function renderTop() {
    const who = $('#who'); who.replaceChildren();
    if (nick) {
      const out = el('button', { className: 'btn ghost', type: 'button', textContent: 'Выйти' });
      out.onclick = () => { nick = null; unlocked = {}; store.set('mc.nick', null); renderAll(); };
      who.append(el('span', { textContent: nick }), out);
    } else {
      const inB = el('button', { className: 'btn', type: 'button', textContent: 'Войти' });
      inB.onclick = () => openReg('login');
      const reg = el('button', { className: 'btn green', type: 'button', textContent: 'Регистрация' });
      reg.onclick = () => openReg('register'); who.append(inB, reg);
    }
    $('#heroBtn').hidden = !!nick;
    $('#heroText').textContent = nick
      ? 'Привет, ' + nick + '. Выбери мод и введи ключ, чтобы открыть скачивание.'
      : 'Создай аккаунт или войди, чтобы читать описания. Чтобы скачать мод, нужен личный ключ доступа.';
  }
  function renderGrid() {
    const grid = $('#grid'); grid.replaceChildren();
    const list = DATA.items.filter(i => filter === 'all' || i.type === filter);
    $('#empty').hidden = list.length > 0;
    for (const it of list) {
      const pic = el('div', { className: 'pic ' + it.type });
      if (it.img) pic.append(el('img', { src: it.img, alt: it.title, loading: 'lazy' }));
      pic.append(el('span', { className: 'tag', textContent: TYPES[it.type] || it.type }));
      const meta = el('div', { className: 'meta' });
      if (it.mc) meta.append(el('span', { textContent: 'MC ' + it.mc }));
      if (it.version) meta.append(el('span', { textContent: 'v' + it.version }));
      const body = el('div', { className: 'body' }, el('h3', { textContent: it.title }), meta);
      if (!nick) {
        body.append(el('p', { className: 'desc locked', textContent: 'Описание откроется после входа.' }));
        const b = el('button', { className: 'btn', type: 'button', textContent: 'Зарегистрироваться' });
        b.onclick = () => openReg('register'); body.append(b);
      } else if (unlocked[it.id]) {
        const dl = el('a', { className: 'btn green', textContent: 'Скачать', target: '_blank', rel: 'noopener noreferrer' });
        body.append(el('p', { className: 'desc', textContent: it.description }), el('p', { className: 'ok', textContent: 'Ключ принят' }), dl);
        // ссылка берётся из зашифрованных данных страницы, поэтому после замены файла она сразу новая
        decryptLink(it, unlocked[it.id]).then(r => { dl.href = safeUrl(r.url); }).catch(() => {
          delete unlocked[it.id]; store.set(ukey(), unlocked); renderGrid();
        });
      } else {
        body.append(el('p', { className: 'desc', textContent: it.description }));
        const b = el('button', { className: 'btn', type: 'button', textContent: 'Ввести ключ для скачивания' });
        b.onclick = () => openKey(it); body.append(b);
      }
      grid.append(el('article', { className: 'card' }, pic, body));
    }
  }
  function renderAll() { renderTop(); renderGrid(); }

  // ---- окна ----
  function show(ov, focusSel) { ov.hidden = false; $(focusSel).focus(); }
  function hide(ov) { ov.hidden = true; }
  function setMode(m) {
    mode = m;
    document.querySelectorAll('#modeTabs .chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.m === m)));
    $('#regBtn').textContent = m === 'login' ? 'Войти' : 'Создать аккаунт';
    $('#pass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
    $('#regErr').textContent = '';
  }
  function openReg(m) { setMode(m === 'login' ? 'login' : 'register'); show($('#regOv'), '#nick'); }
  document.querySelectorAll('#modeTabs .chip').forEach(c => c.onclick = () => setMode(c.dataset.m));
  function openKey(it) { keyItem = it; $('#keyFor').textContent = 'Ключ откроет скачивание: ' + it.title; $('#keyErr').textContent = ''; $('#keyIn').value = ''; show($('#keyOv'), '#keyIn'); }
  document.querySelectorAll('.overlay').forEach(ov => {
    ov.addEventListener('mousedown', e => { if (e.target === ov) hide(ov); });
    ov.querySelector('[data-close]').onclick = () => hide(ov);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.overlay').forEach(hide); });
  $('#heroBtn').onclick = () => openReg('register');

  $('#regForm').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('#nick').value.trim(), pw = $('#pass').value, id = name.toLowerCase(), err = $('#regErr'), btn = $('#regBtn');
    err.textContent = '';
    if (!/^[A-Za-z0-9_А-Яа-яЁё]{3,20}$/.test(name)) { err.textContent = 'Ник: 3–20 символов, буквы, цифры и _'; return; }
    if (pw.length < 8) { err.textContent = 'Пароль должен быть от 8 символов'; return; }
    btn.disabled = true;
    try {
      const acc = accounts();
      if (mode === 'register') {
        if (acc[id]) { err.textContent = 'Этот ник уже занят'; return; }
        const salt = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));
        acc[id] = { nick: name, salt, hash: await pbkdf(pw, salt) };
        store.set('mc.accounts', acc);
        nick = name;
      } else {
        const a = acc[id];
        if (!a || (await pbkdf(pw, a.salt)) !== a.hash) { err.textContent = 'Неверный ник или пароль'; return; }
        nick = a.nick;
      }
      store.set('mc.nick', nick);
      unlocked = store.get(ukey(), {});
      $('#regForm').reset(); hide($('#regOv')); renderAll();
    } catch { err.textContent = 'Не получилось. Попробуй ещё раз.'; }
    finally { btn.disabled = false; }
  });
  $('#keyForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#keyBtn'); btn.disabled = true; $('#keyErr').textContent = '';
    try {
      const r = await decryptLink(keyItem, $('#keyIn').value);
      unlocked[keyItem.id] = r.n; store.set(ukey(), unlocked);
      hide($('#keyOv')); renderGrid();
    } catch (err) {
      const known = ['Ключ не подходит', 'Это ключ от другого мода'];
      $('#keyErr').textContent = err && known.includes(err.message) ? err.message : 'Ключ не подходит';
    } finally { btn.disabled = false; }
  });
  document.querySelectorAll('#chips .chip').forEach(c => c.onclick = () => {
    filter = c.dataset.t;
    document.querySelectorAll('#chips .chip').forEach(x => x.setAttribute('aria-pressed', String(x === c)));
    renderGrid();
  });

  renderAll();
})();
</script>
</body>
</html>
